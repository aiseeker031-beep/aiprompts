<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><link rel="manifest" href="manifest.webmanifest"><title>aiprompts — Free AI Prompt Library</title><style>:root{font-family:system-ui,Roboto,sans-serif;color:#f2f7f2;background:#10151b}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #33414c;padding:20px max(20px,calc((100vw - 1050px)/2));font-size:24px;font-weight:900}header span,h1 em{color:#b5f76a}main{max-width:1090px;padding:20px;margin:auto}.hero{padding:50px 0 30px}h1{font-size:clamp(42px,8vw,78px);line-height:1.05;letter-spacing:-.06em;margin:15px 0}h1 em{font-style:normal}.hero p{color:#a9b7be;max-width:570px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,input{font:inherit;border-radius:12px;border:1px solid #3b4c57;padding:11px 15px;background:#1d2933;color:white}button{cursor:pointer}button.active,.copy{background:#b5f76a;color:#10151b;font-weight:800}input{flex:1;min-width:170px}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:70px}article{background:#19212a;border:1px solid #33414c;border-radius:20px;padding:22px;display:flex;flex-direction:column;min-height:260px}small{color:#b5f76a;font-weight:700}h2{font-size:20px;line-height:1.2}article p{color:#a9b7be;font-size:13px;flex:1;line-height:1.6}.actions{display:flex;gap:8px}footer{padding:25px;text-align:center;border-top:1px solid #33414c;color:#a9b7be}dialog{background:#19212a;color:white;border:1px solid #55646c;border-radius:18px;max-width:650px;width:90%;max-height:85vh;overflow:auto}dialog::backdrop{background:#000b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 system-ui;background:#10151b;padding:18px;border-radius:12px}button:focus-visible,input:focus-visible{outline:2px solid #b5f76a}@media(max-width:800px){#grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){#grid{grid-template-columns:1fr}.hero{padding-top:35px}}</style></head><body><header>ai<span>prompts.</span></header><main><section class="hero"><small>100% FREE · NO SIGNUP</small><h1>Better prompts.<br><em>Brilliant results.</em></h1><p>30 free AI image, video and coding prompts. Search, save your favorites and copy in one tap.</p></section><nav class="controls"><button class="active" data-filter="All">All</button><button data-filter="Image">Images</button><button data-filter="Video">Videos</button><button data-filter="Coding">Coding</button><button data-filter="Saved">♡ Saved</button><input id="search" placeholder="Search prompts..." aria-label="Search prompts"></nav><section id="grid" aria-label="Prompt cards"></section></main><footer>© aiprompts · Free for creators</footer><dialog id="modal"><button id="close">✕ Close</button><h2 id="title"></h2><pre id="full"></pre><button class="copy" id="copyfull">Copy full prompt</button></dialog><script>const prompts=[{"category":"Image","title":"Cinematic Portrait","prompt":"Create a photorealistic 85mm portrait with golden-hour rim light, authentic skin texture and film grain. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Luxury Product Photography","prompt":"Create a premium commercial product on a sculptural stone pedestal with softbox reflections. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Fantasy Floating Island","prompt":"Create a floating island with waterfalls, ancient trees, villages and sunset clouds. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Minimal Brand Poster","prompt":"Create a Swiss grid poster with bold typography, geometric forms and three-color palette. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Cozy Anime Street","prompt":"Create a rainy anime street with glowing lanterns and wet cobblestones. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Architectural Dream Home","prompt":"Create a tropical hillside villa with travertine, glass walls and infinity pool. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Surreal Botanical Sculpture","prompt":"Create a transparent glass silhouette filled with wildflowers in a dramatic gallery. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Food Editorial Close-up","prompt":"Create a luxury food photograph on handmade ceramics with window lighting. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"Futuristic City at Night","prompt":"Create a rain-soaked neon city with skybridges, transit and cinematic fog. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Image","title":"3D Abstract Hero Artwork","prompt":"Create a ceramic ribbons, translucent rings and chrome spheres in studio lighting. Use cinematic composition, refined color grading, intricate realistic details and a clean professional finish. Aspect ratio [choose 9:16 or 16:9]. Avoid watermarks and unwanted text."},{"category":"Video","title":"Cinematic Travel Reveal","prompt":"Generate an 8-second cinematic video showing slow camera reveal of a sunrise destination through foreground flowers. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Luxury Product Spin","prompt":"Generate an 8-second cinematic video showing macro product detail transitioning into a smooth 120-degree orbit. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Coffee Slow Motion","prompt":"Generate an 8-second cinematic video showing slow-motion espresso pouring into ceramic cup with realistic crema. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Fashion Editorial Walk","prompt":"Generate an 8-second cinematic video showing model walking through a concrete gallery with natural fabric movement. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Sci-Fi Portal Opening","prompt":"Generate an 8-second cinematic video showing energy portal activating in an abandoned observatory with dust and light. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Nature Timelapse","prompt":"Generate an 8-second cinematic video showing locked-off mountain valley timelapse from predawn to golden sunrise. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"3D Logo Reveal","prompt":"Generate an 8-second cinematic video showing metallic fragments assembling into a precise logo with light sweep. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Miniature World","prompt":"Generate an 8-second cinematic video showing tiny construction workers assembling a giant strawberry tart. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Ocean Underwater Drift","prompt":"Generate an 8-second cinematic video showing sea turtle gliding across coral reef with natural marine movement. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Video","title":"Room Transformation","prompt":"Generate an 8-second cinematic video showing empty living room transforming into a furnished Japandi interior. Use a smooth continuous camera movement, consistent subjects and geometry, realistic physics, natural lighting, polished film color grading and coherent motion. Aspect ratio 9:16. No captions or watermarks."},{"category":"Coding","title":"Build a Responsive Landing Page","prompt":"Act as an expert software engineer. accessible responsive landing page with hero, benefits, FAQ and CTA. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Debug an Error Systematically","prompt":"Act as an expert software engineer. identify root cause of supplied error and produce smallest tested fix. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"REST API with Validation","prompt":"Act as an expert software engineer. CRUD API with validation, pagination, authentication and error handling. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Refactor for Maintainability","prompt":"Act as an expert software engineer. refactor supplied code without changing external behavior. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Create a Mobile-First Dashboard","prompt":"Act as an expert software engineer. mobile-first dashboard with metrics, filters and loading states. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Write Unit and Integration Tests","prompt":"Act as an expert software engineer. unit and integration tests for happy paths and edge cases. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Optimize Web Performance","prompt":"Act as an expert software engineer. audit Core Web Vitals, bundle size, images and caching. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Database Schema Architect","prompt":"Act as an expert software engineer. PostgreSQL schema with keys, constraints, indexes and migrations. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Secure Code Review","prompt":"Act as an expert software engineer. defensive review for injection, XSS, authorization and secret leaks. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."},{"category":"Coding","title":"Convert Design to HTML","prompt":"Act as an expert software engineer. faithfully translate UI screenshot into responsive semantic HTML. Context: [paste your requirements, code or design]. Return complete runnable code, file structure, clear setup instructions, relevant tests, accessibility and security considerations. Explain assumptions and never claim unexecuted tests passed."}];let filter='All',selected=null;let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('aiprompts-saved')||'[]'))}catch{}const grid=document.querySelector('#grid'),modal=document.querySelector('#modal');function render(){let q=document.querySelector('#search').value.toLowerCase();let list=prompts.map((p,i)=>({...p,id:i})).filter(p=>(filter==='All'||(filter==='Saved'?saved.has(p.id):p.category===filter))&&(p.title+' '+p.prompt).toLowerCase().includes(q));grid.innerHTML=list.map(p=>'<article><small>'+p.category+' · #'+(p.id+1)+'</small><h2>'+p.title+'</h2><p>'+p.prompt.slice(0,160)+'...</p><div class="actions"><button data-view="'+p.id+'">View</button><button class="copy" data-copy="'+p.id+'">Copy</button><button data-save="'+p.id+'">'+(saved.has(p.id)?'♥':'♡')+'</button></div></article>').join('')||'<p>No matching prompts found.</p>'}async function copy(s){try{await navigator.clipboard.writeText(s);alert('Prompt copied!')}catch{alert('Open the prompt and select its text to copy.')}}grid.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let id=Number(b.dataset.view??b.dataset.copy??b.dataset.save);let p=prompts[id];if(b.hasAttribute('data-copy'))copy(p.prompt);else if(b.hasAttribute('data-save')){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('aiprompts-saved',JSON.stringify([...saved]));render()}else{selected=p;document.querySelector('#title').textContent=p.title;document.querySelector('#full').textContent=p.prompt;modal.showModal()}});document.querySelector('#close').onclick=()=>modal.close();document.querySelector('#copyfull').onclick=()=>selected&&copy(selected.prompt);document.querySelector('#search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
